<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flype — мессенджер</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root{--accent:#00AFF0;--accent-hover:#0098D6;--accent-darker:#0078A8;--accent-light:#E5F6FD;--accent-hover-light:#D4F0FB;--accent-border:#B8E4F5;--accent-shadow:rgba(0,175,240,0.35);--white:#FFFFFF;--bg:#F0F2F5;--chat-bg:#FFFFFF;--panel-bg:#FFFFFF;--border:#D3D9DE;--border-light:#E4E9EC;--text:#1C1C1C;--text-secondary:#6E7B8B;--text-muted:#9AAAB8;--text-blue:#0078D4;--danger:#D93025;--success:#34A853;--online:#7FBA00;--radius:4px;--radius-lg:6px;--shadow:0 1px 2px rgba(0,0,0,0.08);--shadow-lg:0 4px 12px rgba(0,0,0,0.15);--font:'Segoe UI','Helvetica Neue',Arial,sans-serif;}
body.theme-green{--accent:#25D366;--accent-hover:#1EBE5D;--accent-darker:#128C7E;--accent-light:#E7F9EE;--accent-hover-light:#D5F3E1;--accent-border:#B5E9C8;--accent-shadow:rgba(37,211,102,0.35);--text-blue:#128C7E;}
body.theme-red{--accent:#E53935;--accent-hover:#C62828;--accent-darker:#B71C1C;--accent-light:#FFEBEE;--accent-hover-light:#FFCDD2;--accent-border:#FFB3B3;--accent-shadow:rgba(229,57,53,0.35);--text-blue:#C62828;}
body.theme-blue{--accent:#1565C0;--accent-hover:#0D47A1;--accent-darker:#0A3880;--accent-light:#E3F2FD;--accent-hover-light:#BBDEFB;--accent-border:#90CAF9;--accent-shadow:rgba(21,101,192,0.35);--text-blue:#0D47A1;}
body.theme-white{--accent:#8A939B;--accent-hover:#6E7B8B;--accent-darker:#4A5560;--accent-light:#F4F6F8;--accent-hover-light:#E4E9EC;--accent-border:#D3D9DE;--accent-shadow:rgba(138,147,155,0.25);--text-blue:#1C1C1C;}
body.theme-orange{--accent:#FF6B35;--accent-hover:#E85D22;--accent-darker:#C74A15;--accent-light:#FFF0E8;--accent-hover-light:#FFE0D0;--accent-border:#FFC9B0;--accent-shadow:rgba(255,107,53,0.35);--text-blue:#C74A15;}
body.theme-purple{--accent:#7B2FBE;--accent-hover:#6325A0;--accent-darker:#4A1B78;--accent-light:#F3E8FA;--accent-hover-light:#E7D5F3;--accent-border:#D4B8E8;--accent-shadow:rgba(123,47,190,0.35);--text-blue:#4A1B78;}
body.theme-pink{--accent:#E91E63;--accent-hover:#C2185B;--accent-darker:#880E4F;--accent-light:#FCE4EC;--accent-hover-light:#F8BBD0;--accent-border:#F48FB1;--accent-shadow:rgba(233,30,99,0.35);--text-blue:#880E4F;}
body.theme-turquoise{--accent:#00BCD4;--accent-hover:#0097A7;--accent-darker:#006064;--accent-light:#E0F7FA;--accent-hover-light:#B2EBF2;--accent-border:#80DEEA;--accent-shadow:rgba(0,188,212,0.35);--text-blue:#006064;}
body.theme-gold{--accent:#F4B400;--accent-hover:#DFA300;--accent-darker:#B8860B;--accent-light:#FFF8E1;--accent-hover-light:#FFECB3;--accent-border:#FFE082;--accent-shadow:rgba(244,180,0,0.35);--text-blue:#B8860B;}
body.dark{--white:#1A1D21;--bg:#0F1216;--chat-bg:#0F1216;--panel-bg:#1A1D21;--border:#2A2F36;--border-light:#23272D;--text:#FFFFFF;--text-secondary:#B8BDC6;--text-muted:#7A838C;--text-blue:var(--accent);--accent-light:#1A2A3D;--accent-hover-light:#22364F;--accent-border:#2A4058;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background 0.3s,color 0.3s;}
.screen{display:none;flex-direction:column;height:100vh;height:100dvh;}
.screen.active{display:flex;animation:screenEnter 0.4s cubic-bezier(0.22,1,0.36,1);}
.btn{padding:8px 18px;border-radius:var(--radius);border:1px solid transparent;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s,border-color 0.15s,transform 0.05s;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;}
.btn:hover{background:var(--accent-hover);}
.btn:active{transform:scale(0.97);}
.btn-secondary{background:var(--white);color:var(--text);border-color:var(--border);}
.btn-secondary:hover{background:var(--bg);border-color:var(--text-muted);}
.btn-danger{background:var(--danger);color:#fff;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
body.theme-white:not(.theme-oldflype) .btn{color:#1C1C1C!important;}
#authScreen{justify-content:center;align-items:center;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-hover) 100%);padding:20px;overflow-y:auto;}
.auth-card{background:var(--white);border-radius:8px;padding:40px 36px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);margin:auto;}
.auth-logo{text-align:center;margin-bottom:6px;}
.auth-logo span{display:inline-block;font-size:40px;font-weight:300;color:var(--accent);letter-spacing:-1px;font-family:'Segoe UI Light',Arial,sans-serif;animation:logoFloat 3s ease-in-out infinite;}
.auth-sub{text-align:center;color:var(--text-secondary);font-size:14px;margin-bottom:28px;}
.auth-tabs{display:flex;border-bottom:1px solid var(--border-light);margin-bottom:24px;}
.auth-tab{flex:1;padding:12px;text-align:center;border:none;background:transparent;font-family:var(--font);font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;margin-bottom:-1px;}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.auth-form{display:none;flex-direction:column;gap:16px;}
.auth-form.active{display:flex;}
.input-group{display:flex;flex-direction:column;gap:5px;}
.input-group label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.3px;}
.input-group input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);color:var(--text);font-size:13.5px;font-family:var(--font);outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
.input-group input::placeholder{color:var(--text-muted);}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-shadow);}
.error-text{color:var(--danger);font-size:11.5px;display:none;}
.error-text.visible{display:block;}
.auth-footer{text-align:center;font-size:11px;color:rgba(255,255,255,0.85);padding:16px;position:fixed;bottom:0;left:0;right:0;}
#mainScreen{background:var(--bg);display:none;flex-direction:column;}
#mainScreen.active{display:flex;}
.main-body{display:flex;flex:1;overflow:hidden;background:var(--white);position:relative;}
.sidebar{width:280px;min-width:220px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-profile{padding:14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light);background:var(--white);cursor:pointer;min-height:70px;}
.sidebar-profile .avatar{width:42px;height:42px;font-size:16px;transition:transform 0.2s;}
.sidebar-profile .info{flex:1;min-width:0;}
.sidebar-profile .info .name{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-profile .info .status{font-size:11.5px;color:var(--online);margin-top:1px;}
.sidebar-search{padding:8px 12px;border-bottom:1px solid var(--border-light);position:relative;}
.sidebar-search i{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:12px;}
.sidebar-search input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--border);border-radius:3px;font-size:12.5px;font-family:var(--font);outline:none;background:var(--white);color:var(--text);}
.sidebar-links{padding:4px 0;border-bottom:1px solid var(--border-light);}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;color:var(--text);cursor:pointer;}
.sidebar-link i{width:16px;color:var(--accent);font-size:13px;}
.sidebar-contacts-header{padding:10px 14px 6px;font-size:11px;text-transform:uppercase;color:var(--text-secondary);font-weight:600;letter-spacing:0.5px;}
.sidebar-tabs{display:flex;padding:0 14px;gap:14px;border-bottom:1px solid var(--border-light);font-size:11px;font-weight:600;text-transform:uppercase;}
.sidebar-tab{padding:6px 0;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;}
.sidebar-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.sidebar-content{flex:1;overflow-y:auto;}
.tab-panel{display:none;flex-direction:column;}
.tab-panel.active{display:flex;}
.sidebar-actions{padding:8px 12px;display:flex;gap:6px;border-bottom:1px solid var(--border-light);}
.sidebar-actions .btn{padding:6px 10px;font-size:12px;flex:1;}
.contacts-group-title{padding:8px 16px 4px;font-size:11.5px;font-weight:600;color:var(--text-secondary);}
.chat-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;}
.chat-item:hover{background:var(--bg);}
.chat-item.active{background:var(--accent-light);border-left-color:var(--accent);}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.sm{width:30px;height:30px;font-size:12px;}
.avatar.lg{width:80px;height:80px;font-size:28px;}
.chat-info{flex:1;min-width:0;}
.chat-info .name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-info .last-msg{font-size:11.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.chat-meta .time{font-size:10.5px;color:var(--text-muted);}
.unread-badge{background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:9px;min-width:16px;text-align:center;}
.status-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;}
.status-item:hover{background:var(--bg);}
.status-avatar{width:38px;height:38px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--accent),var(--online));flex-shrink:0;}
.status-avatar .inner{width:100%;height:100%;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:2px solid var(--white);overflow:hidden;}
.status-avatar .inner img{width:100%;height:100%;object-fit:cover;}
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);min-width:0;position:relative;}
.chat-header{background:var(--white);padding:10px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border-light);flex-shrink:0;min-height:64px;flex-wrap:wrap;}
.chat-header .back-btn{display:none;width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);font-size:15px;cursor:pointer;align-items:center;justify-content:center;}
.chat-header .avatar{width:46px;height:46px;font-size:18px;}
.chat-header .chat-title{flex:1;min-width:0;}
.chat-header .chat-title .name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-header .chat-title .status{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.chat-header .chat-title .status.online{color:var(--online);}
.chat-header .actions{display:flex;gap:6px;margin-right:30px;}
.action-circle{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.messages{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 24px;display:flex;flex-direction:column;gap:2px;background:var(--chat-bg);}
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-secondary);gap:10px;padding:40px;text-align:center;background:var(--chat-bg);}
.empty-chat h1{font-size:24px;font-weight:300;color:var(--accent);margin-bottom:6px;}
.message-row{display:flex;margin-top:6px;}
.message-row.out{justify-content:flex-end;}
.message-row.in{justify-content:flex-start;}
.message-bubble{max-width:65%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.45;word-wrap:break-word;word-break:break-word;overflow-wrap:anywhere;position:relative;}
.message-row.out .message-bubble{background:var(--accent-light);color:var(--text);border:1px solid var(--accent-border);}
.message-row.in .message-bubble{background:#F4F6F8;color:var(--text);border:1px solid var(--border-light);}
.message-bubble .sender-name{font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text-blue);}
.message-bubble .msg-time{font-size:11px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.chat-input-area{background:var(--white);padding:10px 16px 14px;display:flex;align-items:flex-end;gap:10px;border-top:1px solid var(--border-light);flex-shrink:0;position:relative;}
.chat-input-area .input-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-input-area textarea{flex:1;border:1px solid var(--border);border-radius:18px;padding:10px 16px;font-family:var(--font);font-size:13.5px;resize:none;outline:none;background:var(--white);color:var(--text);max-height:110px;min-height:38px;line-height:1.4;}
.chat-input-area .send-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.profile-panel{width:280px;background:var(--white);border-left:1px solid var(--border);display:none;flex-direction:column;overflow-y:auto;flex-shrink:0;position:relative;}
.profile-panel.open{display:flex;}
.profile-panel .profile-head{padding:24px 20px;text-align:center;border-bottom:1px solid var(--border-light);}
.profile-panel .profile-head .avatar{margin:0 auto 12px;}
.profile-panel .profile-head .name{font-size:16px;font-weight:600;}
.profile-panel .profile-head .status{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.profile-section{padding:14px 18px;border-bottom:1px solid var(--border-light);}
.profile-section h4{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);margin-bottom:8px;font-weight:600;}
.profile-id{background:var(--accent-light);border-radius:var(--radius);padding:8px 12px;font-family:'Courier New',monospace;font-size:13px;font-weight:600;color:var(--accent-darker);text-align:center;word-break:break-all;border:1px solid var(--accent-border);}
.profile-action{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:var(--radius);cursor:pointer;color:var(--text);font-size:13px;border:none;background:transparent;width:100%;font-family:var(--font);text-align:left;}
.profile-action:hover{background:var(--bg);}
.profile-action i{width:18px;text-align:center;color:var(--accent);font-size:14px;}
.profile-action.danger i,.profile-action.danger{color:var(--danger);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn 0.2s ease;}
.modal{background:var(--white);border-radius:var(--radius-lg);padding:24px 22px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;position:relative;}
.modal h3{font-size:16px;margin-bottom:18px;text-align:center;color:var(--text);font-weight:600;}
.modal .modal-actions{display:flex;gap:8px;margin-top:20px;}
.modal .modal-actions .btn{flex:1;}
.modal-close-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close-x:hover{background:var(--bg);}
.toast-container{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:6px;}
.toast{background:var(--white);color:var(--text);padding:12px 16px;border-radius:var(--radius);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;min-width:240px;max-width:320px;border-left:3px solid var(--accent);animation:toastSlideIn 0.4s;}
.toast i{font-size:18px;color:var(--accent);}
.toast .toast-text strong{display:block;margin-bottom:2px;font-size:13px;}
.hidden{display:none!important;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes screenEnter{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastSlideIn{from{opacity:0;transform:translateX(40px) scale(0.9);}to{opacity:1;transform:translateX(0) scale(1);}}
@keyframes logoFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
</style>
</head>
<body class="theme-standard">
<button id="globalRefreshBtn" title="Обновить страницу" style="position:fixed; top:16px; right:16px; z-index:9999; width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:var(--text-muted); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'"><i class="fas fa-sync-alt"></i></button>

<div id="authScreen" class="screen active">
<div class="auth-card">
<div class="auth-logo"><span>Flype.</span></div>
<p class="auth-sub">Войдите, чтобы продолжить</p>
<div class="auth-tabs">
<button class="auth-tab active" data-tab="login">ВХОД</button>
<button class="auth-tab" data-tab="register">РЕГИСТРАЦИЯ</button>
</div>
<form class="auth-form active" id="loginForm" onsubmit="return false;">
<div class="input-group"><label>Gmail</label><input type="email" id="loginEmail" placeholder="example@gmail.com"></div>
<div class="input-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="Минимум 6 символов"></div>
<button type="button" id="realLoginBtn" class="btn">Войти</button>
</form>
<form class="auth-form" id="registerForm" onsubmit="return false;">
<div class="input-group"><label>Имя</label><input type="text" id="regFirstName" placeholder="Иван"></div>
<div class="input-group"><label>Фамилия</label><input type="text" id="regLastName" placeholder="Иванов"></div>
<div class="input-group"><label>Gmail</label><input type="email" id="regEmail" placeholder="example@gmail.com"></div>
<div class="input-group"><label>Ник</label><input type="text" id="regUsername" placeholder="admin001"></div>
<div class="input-group"><label>Пароль</label><input type="password" id="regPassword" placeholder="Минимум 6 символов"></div>
<button type="button" id="realRegisterBtn" class="btn">Зарегистрироваться</button>
</form>
</div>
</div>

<div id="mainScreen" class="screen">
<div class="main-body">
<aside class="sidebar" id="sidebar">
<div class="sidebar-profile" id="sidebarProfileBtn">
<div class="avatar" id="sidebarAvatar">?</div>
<div class="info"><div class="name" id="sidebarName">—</div><div class="status" id="sidebarStatus">В сети</div></div>
</div>
<div class="sidebar-search"><i class="fas fa-search"></i><input type="text" id="globalSearch" placeholder="Поиск"></div>
<div class="sidebar-links"><div class="sidebar-link" id="logoutLink" style="color:var(--danger);"><i class="fas fa-sign-out-alt" style="color:var(--danger);"></i> Выход</div></div>
<div class="sidebar-contacts-header">КОНТАКТЫ</div>
<div class="sidebar-tabs">
<button class="sidebar-tab active" data-stab="chats">ЧАТЫ</button>
<button class="sidebar-tab" data-stab="statuses">СТАТУСЫ</button>
</div>
<div class="sidebar-content">
<div class="tab-panel active" id="tabChats">
<div class="sidebar-actions">
<button class="btn btn-secondary" id="newChatBtn" style="font-size:11.5px;"><i class="fas fa-plus"></i> Новый</button>
<button class="btn btn-secondary" id="newGroupBtn" style="font-size:11.5px;"><i class="fas fa-users"></i> Группа</button>
</div>
<div id="chatList"></div>
</div>
<div class="tab-panel" id="tabStatuses">
<div class="sidebar-actions"><button class="btn" id="addStatusBtn" style="font-size:11.5px;"><i class="fas fa-plus"></i> Статус</button></div>
<div id="statusList"></div>
</div>
</div>
</aside>

<main class="chat-area" id="chatArea">
<div class="empty-chat" id="emptyChat"><h1>Flype™</h1><p>Выберите контакт слева</p></div>

<script>
const STORAGE_KEYS = { users: 'flype_users', currentUserId: 'flype_current_user', chats: 'flype_chats', messages: 'flype_messages', statuses: 'flype_statuses', settings: 'flype_settings' };
const ADMIN_UID = 'oqqFsE0hg3Rg2tJnCjLdWNd8o892';
const ADMIN_EMAIL = 'admin.servera.ec@gmail.com';
let state = { currentUser: null, users: [], chats: [], messages: [], statuses: [], settings: {}, activeChatId: null, searchQuery: '' };
let presenceInterval = null;

function loadData(key, fallback = []) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; } }
function saveData(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {} }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function formatTime(ts) { return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
function formatDate(ts) { const d = new Date(ts); const n = new Date(); if (d.toDateString() === n.toDateString()) return 'Сегодня'; const y = new Date(n); y.setDate(y.getDate()-1); if (d.toDateString() === y.toDateString()) return 'Вчера'; return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); }
function initial(name) { return name ? name.trim().charAt(0).toUpperCase() : '?'; }
function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }
function showToast(title, text, icon = 'fa-comment', duration = 3500) { const c = document.getElementById('toastContainer'); const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<i class="fas ${icon}"></i><div class="toast-text"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(text)}</span></div>`; c.appendChild(t); setTimeout(() => { t.remove(); }, duration); }
function getChatInfo(chat) { if (!chat) return { name: 'Чат', avatar: '', online: false }; if (chat.type === 'group') return { name: chat.name || 'Группа', avatar: chat.avatar || '', online: false }; const oid = chat.participants.find(p => p !== state.currentUser.id); const other = state.users.find(u => u.id === oid); if (other) return { name: `${other.firstName} ${other.lastName}`.trim(), avatar: other.avatar || '', online: false, flypeId: other.flypeId }; return { name: 'Пользователь', avatar: '', online: false, flypeId: '—' }; }
function getLastMessage(chatId) { const msgs = state.messages.filter(m => m.chatId === chatId); if (msgs.length === 0) return null; return msgs.sort((a, b) => b.timestamp - a.timestamp)[0]; }
function getMessagePreview(msg) { if (msg.type === 'voice') return '🎤 Голосовое'; if (msg.type === 'image') return '📷 Фото'; return msg.text || ''; }
function persistChats() { saveData(STORAGE_KEYS.chats, state.chats); }
function persistMessages() { saveData(STORAGE_KEYS.messages, state.messages); }
function persistStatuses() { saveData(STORAGE_KEYS.statuses, state.statuses); }

// --- ОСНОВНЫЕ ФУНКЦИИ ОТРИСОВКИ ---
function renderAll() { renderChatList(); renderStatusList(); renderActiveChat(); updateSidebarProfile(); }
function updateSidebarProfile() { const u = state.currentUser; if (!u) return; const name = `${u.firstName} ${u.lastName}`.trim(); const sn = document.getElementById('sidebarName'); if (sn) sn.textContent = name; const sa = document.getElementById('sidebarAvatar'); if (sa) { if (u.avatar) sa.innerHTML = `<img src="${escapeHtml(u.avatar)}">`; else sa.textContent = initial(name); } }

function renderChatList() {
  const c = document.getElementById('chatList'); if (!c) return;
  let chats = [...state.chats]; const q = state.searchQuery.toLowerCase();
  if (q) chats = chats.filter(x => getChatInfo(x).name.toLowerCase().includes(q));
  if (chats.length === 0) { c.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:12.5px;">Нет чатов</div>`; return; }
  chats.sort((a, b) => (b.lastMessageAt || b.createdAt) - (a.lastMessageAt || a.createdAt));
  c.innerHTML = chats.map(chat => { const info = getChatInfo(chat); const lastMsg = getLastMessage(chat.id); const isActive = chat.id === state.activeChatId; return `<div class="chat-item ${isActive ? 'active' : ''}" data-chat-id="${chat.id}"><div class="avatar">${info.avatar ? `<img src="${escapeHtml(info.avatar)}">` : initial(info.name)}</div><div class="chat-info"><div class="name">${escapeHtml(info.name)}</div><div class="last-msg">${lastMsg ? escapeHtml(getMessagePreview(lastMsg)) : 'Нет сообщений'}</div></div></div>`; }).join('');
  c.querySelectorAll('.chat-item').forEach(el => el.addEventListener('click', () => { state.activeChatId = el.dataset.chatId; renderAll(); if (window.innerWidth <= 900) document.getElementById('sidebar').classList.add('hidden'); }));
}

function renderActiveChat() {
  const emptyChat = document.getElementById('emptyChat'); const chatHeader = document.getElementById('chatHeader'); const messagesContainer = document.getElementById('messagesContainer'); const chatInputArea = document.getElementById('chatInputArea');
  if (!state.activeChatId) { emptyChat.classList.remove('hidden'); chatHeader.classList.add('hidden'); messagesContainer.classList.add('hidden'); chatInputArea.classList.add('hidden'); return; }
  const chat = state.chats.find(c => c.id === state.activeChatId); if (!chat) { state.activeChatId = null; renderActiveChat(); return; }
  emptyChat.classList.add('hidden'); chatHeader.classList.remove('hidden'); messagesContainer.classList.remove('hidden'); chatInputArea.classList.remove('hidden');
  const info = getChatInfo(chat); document.getElementById('chatHeaderName').textContent = info.name;
  const ae = document.getElementById('chatHeaderAvatar'); if (info.avatar) ae.innerHTML = `<img src="${escapeHtml(info.avatar)}">`; else ae.textContent = initial(info.name);
  renderMessages(chat.id);
}

function renderMessages(chatId) {
  const c = document.getElementById('messagesContainer'); if (!c) return;
  const msgs = state.messages.filter(m => m.chatId === chatId).sort((a, b) => a.timestamp - b.timestamp);
  if (msgs.length === 0) { c.innerHTML = `<div style="text-align:center;color:var(--text-secondary);padding:30px;">Нет сообщений</div>`; return; }
  c.innerHTML = msgs.map(msg => {
    const isOut = msg.senderId === state.currentUser.id; const sender = state.users.find(u => u.id === msg.senderId); const senderName = sender ? `${sender.firstName} ${sender.lastName}` : 'Неизвестный';
    let content = msg.type === 'image' ? `<img src="${msg.imageUrl}" style="max-width:100%;border-radius:8px;">` : escapeHtml(msg.text);
    return `<div class="message-row ${isOut ? 'out' : 'in'}"><div class="message-bubble">${!isOut && state.chats.find(c=>c.id===chatId).type==='group' ? `<div class="sender-name">${escapeHtml(senderName)}</div>` : ''}<div>${content}</div><div class="msg-time">${formatTime(msg.timestamp)}</div></div></div>`;
  }).join('');
  c.scrollTop = c.scrollHeight;
}

function renderStatusList() {
  const c = document.getElementById('statusList'); if (!c) return;
  const statuses = state.statuses.sort((a, b) => b.timestamp - a.timestamp);
  if (statuses.length === 0) { c.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:12.5px;">Нет статусов</div>`; return; }
  c.innerHTML = statuses.map(s => { const u = state.users.find(x => x.id === s.userId); const name = u ? `${u.firstName} ${u.lastName}`.trim() : 'Неизвестный'; return `<div class="status-item"><div class="status-avatar"><div class="inner">${u && u.avatar ? `<img src="${escapeHtml(u.avatar)}">` : initial(name)}</div></div><div class="status-info"><div class="name">${escapeHtml(name)}</div><div class="time">${formatTime(s.timestamp)}</div></div></div>`; }).join('');
}

// --- ОТПРАВКА СООБЩЕНИЙ ---
async function sendMessage(text, type = 'text', extra = {}) {
  if (!state.activeChatId) return;
  if (type === 'text' && !text.trim()) return;
  const chat = state.chats.find(c => c.id === state.activeChatId); if (!chat) return;
  const msg = { chatId: state.activeChatId, senderId: state.currentUser.id, text, encrypted: false, timestamp: Date.now(), type, ...extra };
  state.messages.push({ id: genId(), ...msg });
  if (chat) { chat.lastMessageAt = Date.now(); chat.lastMessage = text; }
  persistMessages(); persistChats(); renderMessages(state.activeChatId); renderChatList();
  if (window.flypeFirebase) { const { database, ref, push, set } = window.flypeFirebase; const nm = push(ref(database, 'messages')); await set(nm, msg); }
}

// --- ВХОД И РЕГИСТРАЦИЯ ---
async function handleLogin(e) {
  if (e) e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  if (!email || password.length < 6) return showToast('Ошибка', 'Введите email и пароль', 'fa-exclamation-circle');
  let foundUser = loadData(STORAGE_KEYS.users, []).find(u => u.email === email && u.password === password);
  if (!foundUser && window.flypeFirebase) {
    try { 
      const cred = await window.flypeFirebase.signInWithEmailAndPassword(window.flypeFirebase.auth, email, password); 
      const snap = await window.flypeFirebase.get(window.flypeFirebase.ref(window.flypeFirebase.database, 'users/' + cred.user.uid)); 
      if (snap.exists()) foundUser = { id: cred.user.uid, ...snap.val() }; 
    } catch (err) { return showToast('Ошибка', 'Неверный логин или пароль', 'fa-exclamation-circle'); }
  }
  if (!foundUser) return showToast('Ошибка', 'Пользователь не найден', 'fa-exclamation-circle');
  localStorage.setItem(STORAGE_KEYS.currentUserId, foundUser.id);
  state.currentUser = foundUser;
  localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(loadData(STORAGE_KEYS.users, []).filter(u => u.id !== foundUser.id).concat([foundUser])));
  showMainScreen();
}

async function handleRegister(e) {
  if (e) e.preventDefault();
  const fName = document.getElementById('regFirstName').value.trim();
  const lName = document.getElementById('regLastName').value.trim();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const uname = document.getElementById('regUsername').value.trim().toLowerCase();
  const password = document.getElementById('regPassword').value;
  if (!fName || !lName || !email || !uname || password.length < 6) return showToast('Ошибка', 'Заполните все поля (пароль от 6 символов)', 'fa-exclamation-circle');
  let uid = genId();
  if (window.flypeFirebase) {
    try { const cred = await window.flypeFirebase.createUserWithEmailAndPassword(window.flypeFirebase.auth, email, password); uid = cred.user.uid; } catch (err) { return showToast('Ошибка', err.message, 'fa-exclamation-circle'); }
  }
  const newUser = { id: uid, flypeId: uname, firstName: fName, lastName: lName, email, password, avatar: '', about: '' };
  state.currentUser = newUser; state.users.push(newUser);
  localStorage.setItem(STORAGE_KEYS.currentUserId, uid); localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(state.users));
  if (window.flypeFirebase) await window.flypeFirebase.set(window.flypeFirebase.ref(window.flypeFirebase.database, 'users/' + uid), newUser);
  showMainScreen();
}

function handleLogout() {
  if (!confirm('Выйти?')) return;
  if (window.flypeFirebase) window.flypeFirebase.signOut(window.flypeFirebase.auth).catch(()=>{});
  localStorage.removeItem(STORAGE_KEYS.currentUserId);
  state.currentUser = null; state.activeChatId = null;
  document.getElementById('mainScreen').classList.remove('active');
  document.getElementById('authScreen').classList.add('active');
}

function showMainScreen() {
  document.getElementById('authScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.add('active');
  state.users = loadData(STORAGE_KEYS.users, []);
  state.chats = loadData(STORAGE_KEYS.chats, []);
  state.messages = loadData(STORAGE_KEYS.messages, []);
  state.statuses = loadData(STORAGE_KEYS.statuses, []);
  renderAll();
  if (window.flypeFirebase) {
    window.flypeFirebase.onValue(window.flypeFirebase.ref(window.flypeFirebase.database, 'users'), (snap) => {
      const data = snap.val() || {}; Object.values(data).forEach(u => { if (!state.users.find(x => x.id === u.id)) state.users.push(u); });
      renderAll();
    });
    window.flypeFirebase.onValue(window.flypeFirebase.ref(window.flypeFirebase.database, 'chats'), (snap) => {
      const data = snap.val() || {}; state.chats = Object.values(data).filter(c => c.participants.includes(state.currentUser.id)); renderChatList();
    });
    window.flypeFirebase.onValue(window.flypeFirebase.ref(window.flypeFirebase.database, 'messages'), (snap) => {
      const data = snap.val() || {}; state.messages = Object.entries(data).map(([id, m]) => ({ id, ...m })); if (state.activeChatId) renderMessages(state.activeChatId); renderChatList();
    });
  }
}
function checkAuth() { const userId = localStorage.getItem(STORAGE_KEYS.currentUserId); if (userId) { const user = loadData(STORAGE_KEYS.users, []).find(u => u.id === userId); if (user) { state.currentUser = user; showMainScreen(); return true; } } document.getElementById('authScreen').classList.add('active'); return false; }
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get, push, update } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyAIbeepIF2GPcXQUZAt2cr2r54JNM6jMLM", authDomain: "flype-d8034.firebaseapp.com", databaseURL: "https://flype-d8034-default-rtdb.firebaseio.com", projectId: "flype-d8034" };
const app = initializeApp(firebaseConfig); const database = getDatabase(app); const auth = getAuth(app);
window.flypeFirebase = { database, ref, set, onValue, get, push, update, auth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut };
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('globalRefreshBtn').onclick = () => location.reload();
  document.getElementById('realLoginBtn').onclick = (e) => { e.preventDefault(); handleLogin(e); };
  document.getElementById('realRegisterBtn').onclick = (e) => { e.preventDefault(); handleRegister(e); };
  document.getElementById('logoutLink').onclick = handleLogout;
  
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.onclick = function() { document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active')); this.classList.add('active'); document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active')); document.getElementById(this.dataset.tab === 'login' ? 'loginForm' : 'registerForm').classList.add('active'); };
  });
  document.querySelectorAll('.sidebar-tab').forEach(tab => {
    tab.onclick = function() { document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active')); this.classList.add('active'); document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active')); document.getElementById(this.dataset.stab === 'chats' ? 'tabChats' : 'tabStatuses').classList.add('active'); };
  });

  // НОВЫЙ ЧАТ
  document.getElementById('newChatBtn').onclick = () => {
    document.getElementById('newChatSearch').value = '';
    renderNewChatResults('');
    document.getElementById('newChatOverlay').classList.add('open');
  };
  document.getElementById('newChatCancel').onclick = () => document.getElementById('newChatOverlay').classList.remove('open');
  document.getElementById('newChatSearch').oninput = (e) => renderNewChatResults(e.target.value);

  window.renderNewChatResults = (q) => {
    const c = document.getElementById('newChatResults'); const query = q.toLowerCase();
    let usrs = state.users.filter(u => u.id !== state.currentUser.id);
    if (query) usrs = usrs.filter(u => `${u.firstName} ${u.lastName}`.toLowerCase().includes(query) || (u.flypeId||'').includes(query));
    if (usrs.length === 0) { c.innerHTML = '<div style="text-align:center;padding:10px;color:gray;">Никого нет</div>'; return; }
    c.innerHTML = usrs.map(u => `<div class="chat-item" data-id="${u.id}" style="cursor:pointer;border:none;"><div class="avatar sm">${u.avatar ? `<img src="${u.avatar}">` : initial(u.firstName)}</div><div class="chat-info"><div class="name">${u.firstName} ${u.lastName}</div><div class="last-msg">@${u.flypeId}</div></div></div>`).join('');
    c.querySelectorAll('.chat-item').forEach(el => el.onclick = () => {
      const uid = el.dataset.id;
      let chat = state.chats.find(ch => ch.type === 'private' && ch.participants.includes(uid) && ch.participants.includes(state.currentUser.id));
      if (!chat) {
        chat = { id: genId(), type: 'private', participants: [state.currentUser.id, uid], createdAt: Date.now() };
        state.chats.push(chat); persistChats();
        if (window.flypeFirebase) window.flypeFirebase.set(window.flypeFirebase.ref(window.flypeFirebase.database, 'chats/' + chat.id), chat);
      }
      state.activeChatId = chat.id; renderAll(); document.getElementById('newChatOverlay').classList.remove('open');
    });
  };

  // СОЗДАТЬ ГРУППУ
  document.getElementById('newGroupBtn').onclick = () => {
    document.getElementById('groupName').value = '';
    renderNewGroupContacts();
    document.getElementById('newGroupOverlay').classList.add('open');
  };
  document.getElementById('newGroupCancel').onclick = () => document.getElementById('newGroupOverlay').classList.remove('open');
  window.renderNewGroupContacts = () => {
    const c = document.getElementById('newGroupContacts');
    let usrs = state.users.filter(u => u.id !== state.currentUser.id);
    c.innerHTML = usrs.map(u => `<label style="display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #eee;cursor:pointer;"><input type="checkbox" class="grp-chk" value="${u.id}"><span>${u.firstName} ${u.lastName}</span></label>`).join('');
  };
  document.getElementById('newGroupCreate').onclick = () => {
    const name = document.getElementById('groupName').value.trim(); if (!name) return alert('Введите название');
    const ids = [state.currentUser.id]; document.querySelectorAll('.grp-chk:checked').forEach(chk => ids.push(chk.value));
    const chat = { id: genId(), type: 'group', name, participants: ids, createdAt: Date.now() };
    state.chats.push(chat); persistChats();
    if (window.flypeFirebase) window.flypeFirebase.set(window.flypeFirebase.ref(window.flypeFirebase.database, 'chats/' + chat.id), chat);
    state.activeChatId = chat.id; renderAll(); document.getElementById('newGroupOverlay').classList.remove('open');
  };

  // НАСТРОЙКИ
  document.getElementById('sidebarProfileBtn').onclick = () => {
    const u = state.currentUser; if (!u) return;
    document.getElementById('settingsFirstName').value = u.firstName || '';
    document.getElementById('settingsLastName').value = u.lastName || '';
    document.getElementById('settingsAbout').value = u.about || '';
    document.getElementById('settingsUsername').textContent = '@' + (u.flypeId || '');
    document.getElementById('settingsAvatarPreview').innerHTML = u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : initial(u.firstName);
    document.getElementById('settingsOverlay').classList.add('open');
  };
  document.getElementById('settingsCancel').onclick = () => document.getElementById('settingsOverlay').classList.remove('open');
  document.getElementById('settingsSave').onclick = () => {
    state.currentUser.firstName = document.getElementById('settingsFirstName').value;
    state.currentUser.lastName = document.getElementById('settingsLastName').value;
    state.currentUser.about = document.getElementById('settingsAbout').value;
    const idx = state.users.findIndex(x => x.id === state.currentUser.id); if (idx !== -1) state.users[idx] = state.currentUser;
    localStorage.setItem(STORAGE_KEYS.users, JSON.stringify(state.users));
    if (window.flypeFirebase) window.flypeFirebase.update(window.flypeFirebase.ref(window.flypeFirebase.database, 'users/' + state.currentUser.id), { firstName: state.currentUser.firstName, lastName: state.currentUser.lastName, about: state.currentUser.about });
    updateSidebarProfile(); document.getElementById('settingsOverlay').classList.remove('open'); showToast('Сохранено', '', 'fa-check');
  };
  document.getElementById('settingsAvatarBtn').onclick = () => document.getElementById('settingsAvatarFile').click();
  document.getElementById('settingsAvatarFile').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader(); reader.onload = (ev) => {
      const img = new Image(); img.onload = () => {
        const canvas = document.createElement('canvas'); const max = 150; let w = img.width, h = img.height; if (w > max) { h = h*max/w; w = max; } canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        state.currentUser.avatar = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('settingsAvatarPreview').innerHTML = `<img src="${state.currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        if (window.flypeFirebase) window.flypeFirebase.update(window.flypeFirebase.ref(window.flypeFirebase.database, 'users/' + state.currentUser.id), { avatar: state.currentUser.avatar });
      }; img.src = ev.target.result;
    }; reader.readAsDataURL(file);
  };

  // ОТПРАВКА СООБЩЕНИЙ
  document.getElementById('sendBtn').onclick = () => {
    const input = document.getElementById('messageInput'); const txt = input.value.trim();
    if (txt) { sendMessage(txt); input.value = ''; input.style.height = 'auto'; }
  };

  // КРЕСТИКИ
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.modal-close-x'); if (!btn) return;
    e.preventDefault(); const parent = btn.closest('.modal-overlay'); if (parent) parent.classList.remove('open');
    const oid = btn.dataset.close; if (oid) { const el = document.getElementById(oid); if (el) el.classList.remove('open'); }
  });

  checkAuth();
});
</script>
</body>
</html>
